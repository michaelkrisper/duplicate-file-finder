name: Tickets

# Every pull request needs a ticket. The issue number is taken from the branch
# name (<issue>-<slug>, as created by `gh issue develop`) and written into the
# description as "Closes #<issue>", so merging closes the issue. Bot PRs
# (Dependabot) pass without a ticket.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  ticket:
    name: Linked ticket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - run: python3 .github/scripts/release.py ticket
        env:
          GH_TOKEN: ${{ github.token }}
